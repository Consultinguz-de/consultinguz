<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:Archivo,sans-serif;background:#fff;color:#111;display:flex;flex-direction:column}
.bar{display:flex;justify-content:space-between;padding:26px 64px 22px;border-bottom:2px solid #111;font-size:21px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.main{flex:1;padding:0 64px;display:flex;flex-direction:column;justify-content:center}
h1{font-stretch:75%;font-weight:800;text-transform:uppercase;font-size:176px;line-height:.93;letter-spacing:-.01em}
mark{background:#f2b705;color:#111;padding:0 .1em}
.foot{background:#111;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 64px;height:118px}
.brand{display:flex;align-items:center;gap:18px;font-stretch:75%;font-weight:800;font-size:54px;letter-spacing:-.01em}
.brand span{background:#fff;width:68px;height:68px;display:grid;place-content:center}
.brand img{width:54px;height:54px}
.url{font-size:27px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#f2b705}
</style></head><body>
<div class="bar"><span>Internationale Personalvermittlung</span><span>Usbekistan → Deutschland</span></div>
<div class="main"><h1>Fachkräfte,<br>die <mark>bleiben.</mark></h1></div>
<div class="foot"><div class="brand"><span><img src="../public/consulting-logo.png"></span>consultinguz</div><div class="url">www.consultinguz.de</div></div>
</body></html>
